<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice application form</title></head>
<body>
<!-- Local practice form for testing the auto-apply engine; nothing is sent anywhere. -->
<h1>Apply: Frontend Engineer</h1>
<form id="f">
  <label for="fn">First name *</label><input id="fn" required>
  <label for="ln">Last name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <label for="ph">Phone</label><input id="ph" type="tel">
  <label for="li">LinkedIn profile</label><input id="li">
  <label for="cv">Resume/CV *</label><input id="cv" type="file" accept=".pdf" required>
  <label for="yrs">How many years of React experience?</label><input id="yrs" type="number">
  <label for="country">Country</label>
  <select id="country"><option>Select...</option><option>Germany</option><option>Armenia</option><option>United States</option></select>
  <fieldset><legend>Will you require visa sponsorship?</legend>
    <label><input type="radio" name="visa" value="y"> Yes</label>
    <label><input type="radio" name="visa" value="n"> No</label>
  </fieldset>
  <label><input type="checkbox" id="privacy" required> I agree to the privacy policy</label>
  <label><input type="checkbox" id="news"> Send me marketing newsletters</label>
  <button type="submit">Submit application</button>
</form>
<script>
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id);
    window.result = {
      fn: v('fn').value, ln: v('ln').value, em: v('em').value, ph: v('ph').value, li: v('li').value,
      cv: v('cv').files[0]?.name, yrs: v('yrs').value, country: v('country').value,
      visa: document.querySelector('[name=visa]:checked')?.parentElement.innerText.trim(),
      privacy: v('privacy').checked, news: v('news').checked,
    };
    document.body.innerHTML = '<h2>Thank you for applying!</h2><pre>' + JSON.stringify(window.result, null, 1) + '</pre>';
  });
</script>
</body>
</html>
