<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPilot · Browser</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1310; color: #e4eee8; font: 13px "Segoe UI", system-ui, sans-serif; }
  #screen { position: absolute; inset: 0; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #8ea097; text-align: center; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="msg">Connecting to the JobPilot browser…</div>
<script type="module">
  // Live view of the server's Chrome (noVNC). Click and type here to log in to LinkedIn / Upwork.
  import RFB from './vendor/novnc/core/rfb.js';

  const msg = document.getElementById('msg');
  const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/websockify`;
  let retry = 0;

  function connect() {
    const rfb = new RFB(document.getElementById('screen'), url, { wsProtocols: ['binary'] });
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.focusOnClick = true;
    rfb.addEventListener('connect', () => { msg.hidden = true; retry = 0; });
    rfb.addEventListener('disconnect', () => {
      msg.hidden = false;
      msg.textContent = 'Browser view disconnected. Reconnecting…';
      setTimeout(connect, Math.min(10000, 1000 * 2 ** retry++));
    });
  }
  connect();
</script>
</body>
</html>
